    <span class="brand-text"><span class="brand-name">新配方的<b>工具箱</b></span><span class="brand-sub">自己做的工具，都收在這裡</span></span>

</header>

<main class="bench">
  <h1 class="sr">新配方的工具箱</h1>
  <section class="rack" id="rack" aria-label="工具欄位"></section>
  <div class="veil" id="veil" hidden></div>
  <aside class="panel" id="panel" aria-live="polite" aria-labelledby="p-name">
    <button class="close" id="close" type="button" aria-label="關閉">×</button>
    <div class="p-head"><img class="p-icon" id="p-icon" alt="" width="72" height="72"><div><p class="p-type" id="p-type"></p><h2 id="p-name"></h2></div></div>
    <p class="p-desc" id="p-desc"></p>
    <dl class="spec" id="spec"></dl>
    <details class="notes" id="notes" hidden><summary>這一版更新了什麼</summary><ul id="notes-list"></ul></details>
    <a class="go" id="go"></a>
  </aside>
</main>

<footer class="foot"><span>作者：新配方</span><span class="grille" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span></footer>
